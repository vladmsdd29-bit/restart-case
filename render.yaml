services:
  - type: web
    name: restart-case
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: STORE_DIR
        value: /opt/render/project/src/storage
    disk:
      name: restart-case-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
